version: "3"
services:
  react-app:
    build:
      context: ./leaderboard
      dockerfile: Dockerfile
    ports:
      - "6968:80"
    networks:
      - app-network
    restart: unless-stopped

  express-server:
    build:
      context: ./leaderboard_server
      dockerfile: Dockerfile
    ports:
      - "6969:6969"
    volumes:
      - ./leaderboard_server/persistance:/app/persistance/
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
